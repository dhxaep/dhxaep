name: Update Profile Date
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Date in README
        run: |
          CURRENT_DATE=$(date +"%d %B %Y")
          FORMATTED_DATE=$(date +"%d\/%m\/%Y")
          echo "Updating date to $CURRENT_DATE"
          sed -i -E "s/LAST SESSION: [0-9]{2} [A-Za-z]+ [0-9]{4}/LAST SESSION: $CURRENT_DATE/g" README.md
          sed -i -E "s/DATE: [0-9]{2}\/[0-9]{2}\/[0-9]{4}/DATE: $FORMATTED_DATE/g" README.md
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update last session date" && git push)
